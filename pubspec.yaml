name: medisafe
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5+5
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  intl: ^0.18.1
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.14.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.15.5
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  pin_code_fields: ^8.0.1
  flutter_config_plus: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: LibreBaskerville
      fonts:
        - asset: fonts/LibreBaskerville.ttf
        - asset: fonts/LibreBaskerville_Italic.ttf
          style: italic
